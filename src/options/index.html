<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Where's the Damn Download? — Settings</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial,
          sans-serif;
        font-size: 14px;
        line-height: 1.5;
        max-width: 560px;
        margin: 0 auto;
        padding: 24px 16px;
      }
      h1 {
        font-size: 20px;
      }
      fieldset {
        border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
        border-radius: 6px;
        margin: 16px 0;
        padding: 12px 16px;
      }
      legend {
        font-weight: 600;
        padding: 0 4px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 8px 0;
      }
      select {
        font: inherit;
      }
      .muted {
        opacity: 0.75;
        font-size: 12px;
      }
      #status {
        min-height: 1.5em;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script src="options.js" defer></script>
  </body>
</html>
